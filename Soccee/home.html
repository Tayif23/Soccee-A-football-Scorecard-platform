<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SOCCEE — Wireframe</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="styles.css">
</head>
<body class="bg-white">
  <!-- Static wireframe: same markup/skeleton as index.html, but with placeholder
       data baked in and no app.js. Use this to sanity-check layout/responsiveness
       before wiring up the live data in index.html. -->

  <header class="soccee-topbar">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-4 py-3">
      <div class="soccee-logo">SOCCEE</div>
      <button class="bg-white text-[#0d1b3e] font-semibold text-sm px-4 py-1.5 rounded-full">Login / Register</button>
    </div>
  </header>

  <nav class="soccee-blackbar">
    <div class="max-w-7xl mx-auto flex flex-wrap items-center justify-between px-4 py-3 gap-2">
      <div class="flex items-center gap-2">
        <button aria-label="menu" class="text-white text-xl leading-none">&#9776;</button>
        <span class="brand-tagline">A Scorecard Platform</span>
      </div>
      <ul class="flex items-center gap-5 text-sm">
        <li class="nav-link-black active">Matches</li>
        <li class="nav-link-black">Table</li>
        <li class="nav-link-black">Teams</li>
        <li class="nav-link-black">More</li>
      </ul>
    </div>
  </nav>

  <main class="max-w-5xl mx-auto px-4 py-8">
    <div class="text-center mb-4">
      <span class="stage-badge">Round of 16</span>
    </div>

    <section class="match-card p-6 md:p-10 mb-6">
      <div class="flex items-center justify-between gap-4">
        <div class="team-block">
          <img class="team-flag" src="https://flagcdn.com/w80/ar.png" alt="Argentina">
          <div class="font-semibold text-sm md:text-base">Argentina</div>
          <div class="scorers-list">
            <div class="scorer-row">&#9917; L. Messi 34'</div>
            <div class="scorer-row">&#9917; J. Álvarez 78'</div>
          </div>
        </div>
        <div class="flex flex-col items-center gap-1">
          <div class="score-box">2 - 0</div>
          <div class="text-xs text-gray-500">Full Time</div>
        </div>
        <div class="team-block">
          <img class="team-flag" src="https://flagcdn.com/w80/at.png" alt="Austria">
          <div class="font-semibold text-sm md:text-base">Austria</div>
          <div class="scorers-list"></div>
        </div>
      </div>
    </section>

    <div class="flex items-center justify-center gap-2 mb-6">
      <span class="nav-link-red active">Stats</span>
      <span class="nav-link-red">Lineups</span>
      <span class="nav-link-red">Player Info</span>
    </div>

    <section class="tab-panel">
      <div class="grid grid-cols-1 gap-4">
        <div class="stat-row">
          <div class="flex justify-between text-sm font-medium mb-1">
            <span>48%</span><span class="stat-label">Possession</span><span>52%</span>
          </div>
          <div class="stat-bar-track">
            <div class="stat-bar-home" style="width:48%"></div>
            <div class="stat-bar-away" style="width:52%"></div>
          </div>
        </div>
      </div>
    </section>
  </main>

  <footer class="border-t border-gray-200 mt-10 py-6 text-center text-xs text-gray-400">
    SOCCEE wireframe — static placeholder data.
  </footer>
</body>
</html>
